title: GAM
description: Git Account Manager — CLI and AI-agent Git identities
theme: just-the-docs

url: https://lucasgio.github.io
baseurl: /gam-cli

permalink: pretty

search_enabled: true
search:
  heading_level: 3
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
color_scheme: light

aux_links:
  "GitHub":
    - "https://github.com/lucasgio/gam-cli"
  "Releases":
    - "https://github.com/lucasgio/gam-cli/releases"

aux_links_new_tab: true

nav_external_links:
  - title: Source on GitHub
    url: https://github.com/lucasgio/gam-cli
    hide_icon: false

footer_content: >-
  GAM is a Git Account Manager. Documentation follows
  <a href="https://diataxis.fr/">Diátaxis</a>.
  <a href="https://github.com/lucasgio/gam-cli">Source</a>.

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/lucasgio/gam-cli"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    color: blue
  note:
    color: blue
  warning:
    color: red
  new:
    color: green

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
